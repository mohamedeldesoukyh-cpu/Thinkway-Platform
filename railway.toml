# Discovery worker on Railway (Next.js app deploys via Vercel).
# Service Root Directory must be `/` (monorepo root) so Docker context includes `@/*`.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npm run discovery:worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
