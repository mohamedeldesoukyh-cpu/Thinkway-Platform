<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thinkway — Campaign Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@500;600;700&display=swap">
<style>



/* Thinkway finance suite. Every selector scoped to .tw-*. One grid engine:
   .tw-g sets its own track list per page via --cols, so a header, its rows and
   its footer can never disagree about column count. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
 --tw-blue:#0057FF;--tw-b2:#1A6FFF;--tw-bi:#0B52E0;--tw-bdk:#0040CC;--tw-navy:#060810;
 --tw-ink:#0B0F1A;--tw-ink2:#41495A;--tw-mut:#64748B;--tw-line:#E2E8F0;--tw-hair:#EDF0F5;
 --tw-bg:#FAFBFC;--tw-soft:#F6F8FB;--tw-lav:#EFF4FF;
 --tw-ok:#0A7A55;--tw-okb:#E9F7F1;--tw-wrn:#8A5D12;--tw-wrnb:#FFF6E8;
 --tw-bad:#C82121;--tw-badb:#FEF2F2;--tw-vio:#5B3FD1;--tw-viob:#F1EDFE;
 --tw-grad:linear-gradient(145deg,#0040CC 0%,#0057FF 40%,#1A6FFF 70%,#0048DD 100%);
 --tw-ring:0 0 0 1px rgba(0,87,255,.05),0 8px 24px rgba(0,87,255,.06);
 --tw-ez:cubic-bezier(.23,1,.32,1)}
body{background:var(--tw-bg);color:var(--tw-ink);font:400 15px/1.5 'Geist','Inter','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.tw-app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
/* ---------- nav ---------- */
.tw-nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:#fff;border-right:1px solid var(--tw-line);padding:14px 10px}
.tw-brand{display:flex;align-items:center;gap:9px;padding:4px 8px 14px}
.tw-brand span{width:26px;height:26px;border-radius:8px;background:var(--tw-grad)}
.tw-brand b{font-size:14px;font-weight:700;letter-spacing:-.3px}
.tw-brand b i{font-style:normal;color:var(--tw-blue)}
.tw-navg{margin:10px 0 4px;padding:0 9px;font-size:9px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#98A2B3}
.tw-nav a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;text-decoration:none;color:var(--tw-ink2);font-size:12.5px;font-weight:500;cursor:pointer}
.tw-nav a:hover{background:var(--tw-soft)}
.tw-nav a.on{background:var(--tw-lav);color:var(--tw-bi);font-weight:600}
.tw-nav a[data-sub]{padding-left:20px}
.tw-nav a em{margin-left:auto;font-style:normal;font:600 10px 'Geist Mono',monospace;color:var(--tw-mut)}
.tw-nav a.on em{color:var(--tw-bi)}
.tw-main{min-width:0;padding:18px 22px 40px}
/* ---------- head ---------- */
.tw-hd{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:14px}
.tw-hd h1{font-size:19px;font-weight:600;letter-spacing:-.35px}
.tw-hd p{font-size:12px;color:var(--tw-mut);margin-top:2px;max-width:640px}
.tw-sp{flex:1 1 auto}
.tw-b{height:32px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border:.8px solid #E3E8F2;border-radius:9px;background:#fff;color:var(--tw-ink2);font:600 12.5px 'Geist',sans-serif;cursor:pointer;white-space:nowrap;transition:border-color .15s var(--tw-ez),color .15s}
.tw-b:hover{border-color:rgba(0,87,255,.35);color:var(--tw-bi)}
.tw-b:focus-visible{outline:2px solid var(--tw-blue);outline-offset:2px}
.tw-b.pri{border-color:rgba(0,87,255,.55);color:var(--tw-bi);font-weight:700;font-size:12px;box-shadow:0 0 0 3px rgba(0,87,255,.08),0 2px 14px -3px rgba(0,87,255,.4)}
.tw-b.sm{height:27px;padding:0 10px;font-size:11.5px;border-radius:8px}
.tw-b[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none}
.tw-seg{display:inline-flex;padding:2px;background:var(--tw-soft);border:1px solid var(--tw-hair);border-radius:9px}
.tw-seg button{padding:5px 11px;border:0;border-radius:7px;cursor:pointer;font:600 11.5px 'Geist',sans-serif;background:none;color:var(--tw-mut)}
.tw-seg button[aria-pressed="true"]{background:#fff;color:var(--tw-bi);box-shadow:0 1px 2px rgba(11,15,26,.08)}
/* ---------- kpi ---------- */
.tw-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:10px;margin-bottom:13px}
.tw-k{padding:13px 15px;background:#fff;border-radius:11px;box-shadow:var(--tw-ring)}
.tw-k i{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.62px;text-transform:uppercase;color:var(--tw-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-k b{display:block;margin:6px 0 2px;font:600 22px 'Geist',sans-serif;letter-spacing:-.7px;line-height:1.05;white-space:nowrap}
.tw-k u{display:block;text-decoration:none;font-size:10.5px;color:var(--tw-mut)}
.tw-k.bad{box-shadow:0 0 0 1px #EFB6B6,0 8px 24px rgba(200,33,33,.07)}
.tw-k.bad b,.tw-k.bad u{color:var(--tw-bad)}
.tw-k.ok b{color:var(--tw-ok)}
/* ---------- card + universal grid ---------- */
.tw-c{background:#fff;border-radius:12px;box-shadow:var(--tw-ring);overflow:hidden;margin-bottom:14px}
.tw-ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 15px;border-bottom:1px solid var(--tw-line)}
.tw-ct{font-size:13px;font-weight:600}
.tw-cs{font-size:11px;color:var(--tw-mut)}
.tw-sc{overflow-x:auto}
.tw-g{display:grid;grid-template-columns:var(--cols);align-items:center}
.tw-g > *{padding:0 8px;min-width:0}
.tw-hr{position:sticky;top:0;z-index:3;background:var(--tw-soft);border-bottom:1px solid var(--tw-line);padding:9px 8px}
.tw-hr > *{font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tw-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-r{padding:11px 8px;border-bottom:1px solid var(--tw-hair)}
.tw-r:hover{background:#FBFCFF}
.tw-r.bad{background:#FFF8F8;box-shadow:inset 3px 0 0 var(--tw-bad)}
.tw-r.wrn{background:#FFFCF5;box-shadow:inset 3px 0 0 #E0A93C}
.tw-r.sel{background:var(--tw-lav)}
.tw-r.sub{background:var(--tw-soft);padding:9px 8px;border-bottom:1px solid #E6EAF1}
.tw-ft{padding:11px 8px;background:#F2F5FA;border-top:2px solid var(--tw-line)}
.tw-ft > *{font-size:11px;font-weight:600}
.tw-gp{padding:8px 14px;background:#EDF1F7;border-bottom:1px solid var(--tw-hair);font:600 12px 'Geist',sans-serif}
.tw-gp em{font-style:normal;font-family:'Geist Mono',monospace;font-weight:500;font-size:10.5px;color:var(--tw-mut);margin-left:8px}
.tw-rr{text-align:right}
/* ---------- cell types ---------- */
.tw-id{font:600 12px 'Geist Mono',monospace;letter-spacing:-.3px;color:var(--tw-ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-nm{font-size:13px;font-weight:600;letter-spacing:-.1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-t{font-size:12px;color:var(--tw-ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-br{font-size:12px;font-weight:500;color:var(--tw-vio);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-s{display:block;font-size:10.5px;color:var(--tw-mut);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tw-v{font:600 12.5px 'Geist Mono',monospace;font-variant-numeric:tabular-nums;letter-spacing:-.3px;text-align:right;white-space:nowrap}
.tw-v.z{color:#B6BECD;font-weight:500}
.tw-v.neg{color:var(--tw-bad)}
.tw-v.pos{color:var(--tw-ok)}
.tw-d{font:500 11.5px 'Geist Mono',monospace;color:var(--tw-ink2);white-space:nowrap}
.tw-miss{color:#A9B2C3;font-style:italic;font-size:11.5px}
.tw-cc{display:inline-block;padding:1px 6px;border-radius:5px;background:var(--tw-soft);border:1px solid var(--tw-hair);font:700 9.5px 'Geist Mono',monospace;letter-spacing:.3px;color:var(--tw-mut)}
.tw-p{display:inline-block;padding:2px 8px;border-radius:999px;font:600 10px 'Geist',sans-serif;white-space:nowrap}
.p-n{background:var(--tw-soft);color:var(--tw-mut)}
.p-g{background:var(--tw-okb);color:var(--tw-ok)}
.p-y{background:var(--tw-wrnb);color:var(--tw-wrn)}
.p-r{background:var(--tw-badb);color:var(--tw-bad)}
.p-b{background:var(--tw-lav);color:var(--tw-bi)}
.p-v{background:var(--tw-viob);color:var(--tw-vio)}
.tw-act{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.tw-bar{display:block;height:4px;border-radius:999px;background:var(--tw-hair);overflow:hidden}
.tw-bar i{display:block;height:100%;background:var(--tw-blue)}
.tw-bar i.r{background:var(--tw-bad)}
.tw-bar i.y{background:#E0A93C}
.tw-ck{width:15px;height:15px;accent-color:var(--tw-blue);cursor:pointer}
.tw-x{width:21px;height:21px;border:1px solid var(--tw-hair);border-radius:6px;background:#fff;color:var(--tw-mut);font-size:9px;line-height:1;cursor:pointer}
.tw-x:hover{border-color:var(--tw-blue);color:var(--tw-bi);background:var(--tw-lav)}
.tw-in{width:100%;height:30px;padding:0 9px;border:1px solid var(--tw-line);border-radius:8px;background:#fff;font:500 12.5px 'Geist',sans-serif;color:var(--tw-ink)}
.tw-in:focus{outline:none;border-color:var(--tw-blue);box-shadow:0 0 0 3px rgba(0,87,255,.12)}
.tw-lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.55px;text-transform:uppercase;color:var(--tw-mut);margin-bottom:5px}
.tw-pad{padding:14px 15px}
.tw-note{margin:13px 15px;padding:11px 13px;border-radius:9px;background:var(--tw-soft);font-size:11.5px;color:var(--tw-ink2);line-height:1.55}
.tw-note.bad{background:var(--tw-badb);color:var(--tw-bad)}
.tw-note.wrn{background:var(--tw-wrnb);color:var(--tw-wrn)}
.tw-empty{padding:44px 20px;text-align:center}
.tw-empty svg{width:34px;height:34px;stroke:#C3CBD8;fill:none;stroke-width:1.4;margin-bottom:10px}
.tw-empty b{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.tw-empty p{font-size:12px;color:var(--tw-mut);max-width:400px;margin:0 auto 12px}
.tw-two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.tw-st{display:flex;gap:26px;flex-wrap:wrap}
.tw-st span{display:flex;flex-direction:column;gap:2px}
.tw-st i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tw-mut)}
.tw-st b{font:600 20px 'Geist Mono',monospace;letter-spacing:-.6px}
.tw-st b.bad{color:var(--tw-bad)}
@media(prefers-reduced-motion:reduce){.tw-b,.tw-r{transition:none}}
@media(max-width:1100px){.tw-two{grid-template-columns:1fr}.tw-app{grid-template-columns:64px minmax(0,1fr)}}
/* ============ Thinkway identity cards — treasury + reports ============ */
.tw-deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.tw-tile{position:relative;isolation:isolate;overflow:hidden;padding:15px 16px 14px;border-radius:16px;
 background:var(--tw-grad);color:#fff;cursor:pointer;min-height:132px;display:flex;flex-direction:column;
 box-shadow:0 1px 2px rgba(0,64,204,.3),0 10px 26px -8px rgba(0,87,255,.42);
 transition:transform .32s var(--tw-ez),box-shadow .32s var(--tw-ez)}
.tw-tile:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(0,64,204,.34),0 20px 40px -10px rgba(0,87,255,.5)}
.tw-tile:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* the mark: two overlapping rings, the Thinkway "way" cut, drawn in CSS only */
.tw-tile::before{content:"";position:absolute;z-index:-1;right:-52px;top:-58px;width:186px;height:186px;
 border-radius:50%;border:30px solid rgba(255,255,255,.10)}
.tw-tile::after{content:"";position:absolute;z-index:-1;right:12px;bottom:-74px;width:150px;height:150px;
 border-radius:50%;border:22px solid rgba(255,255,255,.07)}
.tw-tile.alt{background:linear-gradient(150deg,#0B0F1A 0%,#0E1730 45%,#0040CC 130%)}
.tw-tile.soft{background:linear-gradient(150deg,#EFF4FF 0%,#DFE9FF 100%);color:var(--tw-navy);
 box-shadow:0 0 0 1px rgba(0,87,255,.12),0 10px 26px -12px rgba(0,87,255,.3)}
.tw-tile.soft .tw-tl b{color:var(--tw-navy)}
.tw-tile.soft::before{border-color:rgba(0,87,255,.10)}
.tw-tile.soft::after{border-color:rgba(0,87,255,.07)}
.tw-tile.soft .tw-tl i,.tw-tile.soft .tw-tl p,.tw-tile.soft .tw-go{color:var(--tw-bi)}
.tw-tl{display:flex;flex-direction:column;height:100%}
.tw-tl i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
 color:rgba(255,255,255,.72)}
.tw-tl b{display:block;margin:7px 0 5px;font-size:15px;font-weight:600;letter-spacing:-.25px;line-height:1.2}
.tw-tl p{font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.8)}
.tw-tl .tw-big{font:600 26px 'Geist',sans-serif;letter-spacing:-1px;margin:6px 0 2px;line-height:1}
.tw-go{margin-top:auto;padding-top:10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
 color:rgba(255,255,255,.9)}
.tw-go svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
 transition:transform .3s var(--tw-ez)}
.tw-tile:hover .tw-go svg{transform:translateX(3px)}
.tw-star{position:absolute;top:12px;right:12px;width:22px;height:22px;border:0;border-radius:7px;cursor:pointer;
 background:rgba(255,255,255,.14);color:#fff;font-size:11px;line-height:1}
.tw-tile.soft .tw-star{background:rgba(0,87,255,.1);color:var(--tw-bi)}
.tw-spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}
.tw-spark span{flex:1;border-radius:2px 2px 0 0;background:rgba(255,255,255,.34);min-height:3px}
.tw-tile.soft .tw-spark span{background:rgba(0,87,255,.24)}
.tw-spark span.hi{background:rgba(255,255,255,.92)}
.tw-tile.soft .tw-spark span.hi{background:var(--tw-blue)}
/* ===== campaign detail additions ===== */
.tw-app{grid-template-columns:minmax(0,1fr)}
.tw-main{padding:0 22px 40px}
.tw-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap;padding:14px 0 12px}
.tw-crumb{font-size:11.5px;color:var(--tw-mut)}
.tw-crumb b{color:var(--tw-ink2);font-weight:600}
.tw-title{font:600 20px 'Geist',sans-serif;letter-spacing:-.5px}
.tw-code{font:600 12px 'Geist Mono',monospace;color:var(--tw-mut);letter-spacing:-.2px}
/* decision center */
.tw-dc{border-radius:14px;overflow:hidden;margin-bottom:12px;background:#fff;
 box-shadow:0 0 0 1px #F0C9A0,0 10px 28px -12px rgba(200,120,20,.28)}
.tw-dc__h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 15px;
 background:linear-gradient(140deg,#FFF6E8 0%,#FFEFD6 100%);border-bottom:1px solid #F3DDBA}
.tw-dc__t{font-size:9.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#8A5D12}
.tw-dc__m{font-size:13.5px;font-weight:600;color:#6B4708}
.tw-dc__g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0}
.tw-dc__c{padding:13px 15px;border-right:1px solid var(--tw-hair)}
.tw-dc__c:last-child{border-right:0}
.tw-dc__c i{display:block;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.7px;
 text-transform:uppercase;color:var(--tw-mut);margin-bottom:5px}
.tw-dc__c b{display:block;font-size:12.5px;font-weight:600;line-height:1.4}
.tw-dc__c p{font-size:11.5px;color:var(--tw-ink2);line-height:1.5;margin-top:3px}
.tw-dc__a{display:flex;gap:7px;flex-wrap:wrap;padding:11px 15px;background:var(--tw-soft);
 border-top:1px solid var(--tw-hair)}
/* commercial band */
.tw-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;background:#fff;
 border-radius:12px;box-shadow:var(--tw-ring);overflow:hidden;margin-bottom:12px}
.tw-band > div{padding:12px 15px;border-right:1px solid var(--tw-hair)}
.tw-band > div:last-child{border-right:0}
.tw-band i{display:block;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.7px;
 text-transform:uppercase;color:var(--tw-mut)}
.tw-band b{display:block;margin:5px 0 2px;font:600 17px 'Geist',sans-serif;letter-spacing:-.5px;white-space:nowrap}
.tw-band u{display:block;text-decoration:none;font-size:10.5px;color:var(--tw-mut)}
.tw-band .g{color:var(--tw-ok)}
/* workspace tabs */
.tw-ws{display:flex;gap:3px;flex-wrap:wrap;padding:5px;background:#fff;border-radius:12px;
 box-shadow:var(--tw-ring);margin-bottom:12px}
.tw-ws button{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:0;border-radius:9px;
 background:none;cursor:pointer;font:600 12.5px 'Geist',sans-serif;color:var(--tw-mut)}
.tw-ws button:hover{background:var(--tw-soft);color:var(--tw-ink2)}
.tw-ws button[aria-pressed="true"]{background:var(--tw-lav);color:var(--tw-bi)}
.tw-ws em{font-style:normal;font:600 10px 'Geist Mono',monospace;padding:1px 5px;border-radius:999px;
 background:var(--tw-soft);color:var(--tw-mut)}
.tw-ws button[aria-pressed="true"] em{background:#fff;color:var(--tw-bi)}
.tw-ws .sp{flex:1 1 auto}
/* locked banner */
.tw-lock{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:11px;
 background:var(--tw-wrnb);border:1px solid #F0D6A4;margin-bottom:12px;font-size:11.5px;color:var(--tw-wrn)}
.tw-lock b{font-weight:700;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase}
/* journey */
.tw-jr{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:7px}
.tw-jn{padding:11px 12px;border-radius:10px;background:var(--tw-soft);border:1px solid var(--tw-hair)}
.tw-jn.ok{background:var(--tw-okb);border-color:#BFE6D5}
.tw-jn.cur{background:var(--tw-lav);border-color:#CDDCFF}
.tw-jn.miss{background:var(--tw-badb);border-color:#F3C4C4}
.tw-jn i{display:block;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.6px;
 text-transform:uppercase;color:var(--tw-mut)}
.tw-jn b{display:block;margin-top:4px;font-size:12px;font-weight:600}
.tw-jn u{display:block;text-decoration:none;font-size:10px;color:var(--tw-mut);margin-top:2px}
/* milestone rail */
.tw-ms{display:flex;flex-direction:column;gap:0}
.tw-mi{display:grid;grid-template-columns:20px minmax(160px,1fr) 130px 116px;gap:12px;align-items:center;
 padding:9px 15px;border-bottom:1px solid var(--tw-hair)}
.tw-mi:last-child{border-bottom:0}
.tw-dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--tw-line);background:#fff;margin:0 auto}
.tw-dot.on{background:var(--tw-ok);border-color:var(--tw-ok)}
.tw-dot.now{background:var(--tw-blue);border-color:var(--tw-blue);box-shadow:0 0 0 3px rgba(0,87,255,.16)}
.tw-dot.warn{background:#E0A93C;border-color:#E0A93C}
.tw-mi.dim b,.tw-mi.dim span{color:#A9B2C3}
/* mini dashboard cards */
.tw-od{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:11px}
.tw-oc{padding:13px 15px;border-radius:12px;background:#fff;box-shadow:var(--tw-ring)}
.tw-oc__h{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.tw-oc__h b{font-size:12.5px;font-weight:600}
.tw-oc__r{display:flex;justify-content:space-between;padding:4px 0;font-size:11.5px}
.tw-oc__r span{color:var(--tw-mut)}
.tw-oc__r b{font:600 12px 'Geist Mono',monospace}
.tw-oc__r b.bad{color:var(--tw-bad)}
.tw-oc__r b.ok{color:var(--tw-ok)}
/* key-value blocks */
.tw-kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:0}
.tw-kv > div{padding:11px 15px;border-right:1px solid var(--tw-hair);border-bottom:1px solid var(--tw-hair)}
.tw-kv i{display:block;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.65px;
 text-transform:uppercase;color:var(--tw-mut)}

/* ============================================================
   TYPE SCALE — single source of truth for numeric values.
   Four steps only. Anything numeric must use one of these.
     20px  headline figure  (KPI cards, big stats)
     14px  panel stat       (summary strips, modal stat cells)
     12.5px row value       (grid cells, key-value rows)
     11.5px micro           (dates, deltas, chips, footnotes)
   ============================================================ */
/* step 1 — headline */
.tw-k b,.tw-mx b,.tw-st b,.tw-soc b{font-size:20px;letter-spacing:-.6px}
/* step 2 — panel stat */
.tw-band b,.tw-mini b,.tw-ms2 b,.tw-cdh__m b,.tw-cm__st b,.tw-cw__g b,.tw-calcp__f b,
.tw-dr__s b,.tw-cin .tw-in{font-size:14px;letter-spacing:-.35px}
/* step 3 — row value */
.tw-v,.tw-kv b,.tw-dc2__r b,.tw-oc__r b,.tw-po b,.tw-str b,.tw-cw__hl b,.tw-dl b,
.tw-calc b,.tw-selbar .sum b,.tw-cwin,.tw-in,.tw-ed,.tw-adf > *,.tw-ft > *,.tw-agtot b{font-size:12.5px}
.tw-ms2 b.s{font-size:12.5px}
/* step 4 — micro */
.tw-d,.tw-delta,.tw-id,.tw-fe b,.tw-kid,.tw-cc,.tw-sub2,.tw-s{font-size:11.5px}
.tw-cc{font-size:9.5px}
/* mono everywhere a number lives, so digits align column to column */
.tw-v,.tw-kv b.m,.tw-dl b.m,.tw-ms2 b,.tw-mini b,.tw-cdh__m b,.tw-cm__st b,.tw-cw__g b,
.tw-calcp__f b,.tw-dr__s b,.tw-selbar .sum b,.tw-cwin,.tw-ed,.tw-po b,.tw-cw__hl b,
.tw-oc__r b,.tw-dc2__r b,.tw-st b,.tw-soc b,.tw-k b,.tw-mx b,.tw-band b,.tw-agtot b{
 font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
/* dates are never mono-bold — they are metadata, not figures */
.tw-d{font-family:'Geist Mono',ui-monospace,monospace;font-weight:500;color:var(--tw-ink2);
 white-space:nowrap;font-variant-numeric:tabular-nums}
.tw-frozen.mini .tw-ms2 b{font-size:12.5px}

/* ===== additive only — everything above is campaign-detail.html verbatim ===== */

 border-top:1px solid var(--tw-hair)}

/* identity bar (light surface — the mark keeps its own navy square) */
.tw-idbar{position:relative;z-index:1;display:flex;align-items:center;gap:11px;padding:9px 15px;
 background:#fff;border-bottom:1px solid var(--tw-hair);cursor:pointer}

 background:#0057FF}

  dl([['Budget','EGP '+F(s[1]),'mono'],['Score',String(s[2]),'mono'],
   ['Confidence',s[4]+'%','mono'],
   ['Claimed impact',E(s[6])+(SCEN>0?' '+flag(1,'check'):'')],
   ['If not this','<span style="color:var(--tw-ink2)">'+E(s[7])+'</span>']])+

  '<h3 style="font-size:15px;font-weight:600;margin:34px 0 13px">How the score is built</h3>'+
  tbl2('minmax(0,1fr) 92px 74px 74px',
   '<span>Part</span><span class="num">Counts for</span><span class="num">Scored</span>'+
   '<span class="num">Confidence</span>',
   SCORE.map(function(sc){
    return '<div class="rw"><span class="nm2">'+sc[0]+'</span>'+
     '<span class="num">'+sc[1]+' / '+sc[2]+'</span>'+
     '<span class="num" style="color:'+(sc[3]<65?'var(--tw-bad)':sc[3]>=90?'var(--tw-ok)':'inherit')+
     '">'+sc[3]+'</span>'+
     '<span class="num">'+sc[4]+'%</span></div>'}).join(''))+
  '<div class="tw-q2 warn">The verdict reads “proceed, no significant differences”. Creator quality '+
  'scores 50 and asks you to replace creators; KPIs score 63 and ask you to change the mix. '+
  flag(1,'review')+'</div>');
}

/* ===== render ===== */
var SPG={intake:sIntake,strategy:sStrategy,creators:sCreators,content:sContent,
 commercial:sCommercial,package:sPackage};
function bindScroll(){
 if(window.__tw)return;window.__tw=true;
 var mini=false,tick=false,idle=0;
 function apply(){
  tick=false;var f=document.getElementById('frozen');if(!f)return;
  var y=window.scrollY;
  if(!mini&&y>88){mini=true;f.classList.add('mini')}
  else if(mini&&y<40){mini=false;f.classList.remove('mini')}
  f.classList.add('scrolling');clearTimeout(idle);
  idle=setTimeout(function(){var g=document.getElementById('frozen');
   if(g)g.classList.remove('scrolling')},140);
 }
 window.addEventListener('scroll',function(){
  if(!tick){tick=true;requestAnimationFrame(apply)}},{passive:true});
 apply();
}
function draw(){
 var doc;
 if(VIEW==='studio'){var f=SPG[T];doc=f?f():'';}
 else doc=VIEW==='outputs'?pgOutputs():VIEW==='director'?pgDirector():pgDecision();
 document.getElementById('app').innerHTML=mast()+
  '<div class="tw-wrap">'+(VIEW==='studio'?rail():'<div></div>')+
  '<div class="tw-doc">'+doc+'</div></div>'+drawer();
 bindScroll();
 if(window.scrollY>88){var g=document.getElementById('frozen');if(g)g.classList.add('mini')}
}
draw();
</script></body></html>
