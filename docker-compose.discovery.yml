services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - discovery_redis_data:/data
    command: redis-server --appendonly yes

  discovery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./services/discovery-worker/.env
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  discovery_redis_data:
